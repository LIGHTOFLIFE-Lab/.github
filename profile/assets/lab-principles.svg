<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="200" viewBox="0 0 1440 200" role="img" aria-labelledby="title desc">
<title id="title">The LIGHT OF LIFE principle</title>
<desc id="desc">See the friction. Light the problem. Remove barriers. Enable action. Make room for dreams.</desc>
<rect x="1" y="1" width="1438" height="198" rx="10" fill="#10161D" stroke="#2C3741"/>
<g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif"><text x="44" y="58" font-size="11" fill="#6C7B89" font-weight="500" letter-spacing="1">01</text><text x="44" y="109" font-size="27" fill="#C8B58E" font-weight="600" letter-spacing="1">SEE</text><text x="44" y="146" font-size="15" fill="#B3BEC7" font-weight="400" letter-spacing="0">Observe friction</text><path d="M300 54V162" stroke="#303A44"/><text x="322" y="58" font-size="11" fill="#6C7B89" font-weight="500" letter-spacing="1">02</text><text x="322" y="109" font-size="27" fill="#C8B58E" font-weight="600" letter-spacing="1">LIGHT</text><text x="322" y="146" font-size="15" fill="#B3BEC7" font-weight="400" letter-spacing="0">Clarify the problem</text><path d="M578 54V162" stroke="#303A44"/><text x="600" y="58" font-size="11" fill="#6C7B89" font-weight="500" letter-spacing="1">03</text><text x="600" y="109" font-size="27" fill="#C8B58E" font-weight="600" letter-spacing="1">REMOVE</text><text x="600" y="146" font-size="15" fill="#B3BEC7" font-weight="400" letter-spacing="0">Reduce barriers</text><path d="M856 54V162" stroke="#303A44"/><text x="878" y="58" font-size="11" fill="#6C7B89" font-weight="500" letter-spacing="1">04</text><text x="878" y="109" font-size="27" fill="#C8B58E" font-weight="600" letter-spacing="1">ENABLE</text><text x="878" y="146" font-size="15" fill="#B3BEC7" font-weight="400" letter-spacing="0">Make action possible</text><path d="M1134 54V162" stroke="#303A44"/><text x="1156" y="58" font-size="11" fill="#6C7B89" font-weight="500" letter-spacing="1">05</text><text x="1156" y="109" font-size="27" fill="#C8B58E" font-weight="600" letter-spacing="1">DREAM</text><text x="1156" y="146" font-size="15" fill="#B3BEC7" font-weight="400" letter-spacing="0">Open possibilities</text></g>
</svg>
